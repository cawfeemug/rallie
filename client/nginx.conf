# Upgrade to WebSocket only when the client asks for it.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Behind a Cloudflare Tunnel the TCP peer is the tunnel container, so prefer the real
# visitor address Cloudflare provides. The API uses this for per-IP rate limits.
# (If nginx is ever exposed to the internet directly, remove this map and use $remote_addr.)
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Look the API up when a request arrives instead of at startup, so nginx does not crash
  # if it starts before the API container (for example after a reboot).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://server:4000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_read_timeout 75s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single page app: unknown paths fall back to index.html so React Router can handle them.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
